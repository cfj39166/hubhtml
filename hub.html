<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23a86bff'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<title>网页合集 · 精选推荐</title>
<style>
:root{
  --bg-0:#0a0518; --bg-1:#150a2e;
  --pink:#ff5c8a; --pink-soft:#ff8fb1;
  --violet:#a86bff; --violet-soft:#c9a6ff;
  --cyan:#5ce1ff; --gold:#ffd479;
  --text:#f3ecff; --text-dim:#a99cc4; --text-faint:#6f6390;
  --glass:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.12);
  --stroke-lit:rgba(255,143,177,.45);
  --font:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font);
  background:var(--bg-0); color:var(--text);
  min-height:100vh; overflow-x:hidden; line-height:1.7;
  -webkit-font-smoothing:antialiased;
  position:relative;
}
body::before{
  content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;
  background:
    radial-gradient(42% 32% at 22% 22%,rgba(168,107,255,.32),transparent 62%),
    radial-gradient(38% 28% at 78% 18%,rgba(255,92,138,.28),transparent 60%),
    radial-gradient(48% 36% at 52% 88%,rgba(92,225,255,.18),transparent 64%);
  filter:blur(40px);animation:drift 22s ease-in-out infinite alternate;
}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1);}50%{transform:translate3d(2%,-2%,0) scale(1.06);}100%{transform:translate3d(-2%,2%,0) scale(1.03);}}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.55) 1px,transparent 1.5px);
  background-size:46px 46px;opacity:.06;
}
::-webkit-scrollbar{width:9px;}::-webkit-scrollbar-track{background:var(--bg-0);}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--pink),var(--violet));border-radius:9px;}
::selection{background:var(--pink);color:#fff;}

.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 20px;}

/* HERO */
.hero{text-align:center;padding:64px 0 40px;animation:fadeUp .9s cubic-bezier(.2,.8,.2,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}
.brand{
  display:inline-flex;align-items:center;gap:9px;padding:7px 18px;border-radius:100px;
  font-size:.76rem;letter-spacing:.26em;color:var(--violet-soft);
  background:var(--glass);border:1px solid var(--stroke);margin-bottom:22px;
}
.brand::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pink);
  box-shadow:0 0 12px var(--pink);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{50%{transform:scale(1.4);}}
.title{
  font-size:clamp(1.9rem,5.6vw,3rem);font-weight:900;letter-spacing:.04em;line-height:1.3;
  background:linear-gradient(100deg,#fff 8%,var(--pink-soft) 42%,var(--violet-soft) 74%,#fff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% auto;animation:shine 6s linear infinite;
}
@keyframes shine{to{background-position:220% center;}}
.sub{font-size:clamp(.9rem,2.4vw,1.04rem);color:var(--text-dim);margin-top:12px;letter-spacing:.06em;}
.count{margin-top:18px;font-size:.8rem;color:var(--text-faint);letter-spacing:.2em;}
.count b{color:var(--pink-soft);font-size:1.05rem;}

/* 筛选标签 */
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:30px 0 10px;}
.tag{
  padding:7px 17px;border-radius:100px;font-size:.82rem;cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);color:var(--text-dim);
  transition:all .3s;user-select:none;
}
.tag:hover{color:#fff;border-color:var(--stroke-lit);background:rgba(255,255,255,.1);}
.tag.on{background:linear-gradient(100deg,var(--pink),var(--violet));color:#fff;border-color:transparent;
  box-shadow:0 6px 20px rgba(255,92,138,.4);}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;padding:30px 0 50px;}
@media(max-width:640px){.grid{grid-template-columns:1fr;gap:16px;}}

.card{
  position:relative;border-radius:22px;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .45s,box-shadow .45s;
  display:flex;flex-direction:column;
  animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) both;
}
.card:hover{transform:translateY(-7px);border-color:var(--stroke-lit);
  box-shadow:0 24px 56px rgba(168,107,255,.3);}
.card-cover{
  position:relative;aspect-ratio:16/10;overflow:hidden;
  background:linear-gradient(135deg,var(--bg-1),var(--bg-0));
}
.card-cover img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .8s cubic-bezier(.2,.8,.2,1);}
.card:hover .card-cover img{transform:scale(1.08);}
.card-cover::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(10,5,24,.92));
}
.cover-badge{
  position:absolute;top:12px;left:12px;z-index:2;
  padding:4px 11px;border-radius:100px;font-size:.68rem;letter-spacing:.12em;
  background:rgba(6,3,15,.7);border:1px solid var(--stroke);backdrop-filter:blur(8px);
}
.cover-badge.hot{background:linear-gradient(100deg,var(--pink),var(--violet));border-color:transparent;}
.cover-badge.new{background:linear-gradient(100deg,var(--cyan),var(--violet));border-color:transparent;}
.card-body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column;}
.card-title{font-size:1.08rem;font-weight:700;letter-spacing:.03em;line-height:1.4;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card-title .arrow{margin-left:auto;color:var(--text-faint);font-size:1rem;transition:transform .3s,color .3s;}
.card:hover .card-title .arrow{transform:translateX(4px);color:var(--pink-soft);}
.card-desc{font-size:.84rem;color:var(--text-dim);line-height:1.85;margin-top:9px;flex:1;}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:14px;padding-top:13px;border-top:1px solid var(--stroke);
  font-size:.74rem;color:var(--text-faint);letter-spacing:.04em;}
.card-meta .cat{color:var(--violet-soft);}
.card-meta .date{}

/* 空状态 */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-faint);}
.empty ico{font-size:2.4rem;display:block;margin-bottom:14px;}

/* 底部 */
.foot{text-align:center;padding:40px 20px 56px;color:var(--text-faint);font-size:.78rem;letter-spacing:.1em;
  border-top:1px solid var(--stroke);}
.foot b{color:var(--pink-soft);}
.back{display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:9px 22px;border-radius:100px;
  background:var(--glass);border:1px solid var(--stroke);color:var(--text-dim);font-size:.82rem;
  text-decoration:none;transition:all .3s;cursor:pointer;}
.back:hover{background:var(--glass);border-color:var(--stroke-lit);color:#fff;}

/* 微信内打开时优化 */
@media(max-width:640px){
  .hero{padding:48px 0 30px;}
  .card-cover{aspect-ratio:16/11;}
  .card-body{padding:15px 17px 17px;}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div class="brand">WEB COLLECTION</div>
    <h1 class="title">网页合集</h1>
    <p class="sub">点开任一卡片，进入对应的小宇宙</p>
    <div class="count">共 <b id="totalCount">0</b> 个网页 · 持续更新中</div>
  </header>

  <div class="tags" id="tags"></div>
  <div class="grid" id="grid"></div>

  <footer class="foot">
    <div>持续更新 · 收藏本页随时回来</div>
    <a class="back" href="javascript:history.back()">‹ 返回上一页</a>
  </footer>
</div>

<script>
/* ============================================================
   CONFIG —— 在这里增删网页卡片
   每张卡片支持字段：
   - title:    卡片标题（必填）
   - desc:     一句话描述
   - url:      点击跳转的网址（必填，部署后填真实地址）
   - cover:    封面图，留空自动生成渐变占位图
   - cat:      分类标签（用于筛选）
   - badge:    角标，可选值："" / "hot" / "new"
   - date:     发布/更新日期
   ============================================================ */
const PAGES = [
  {
    title: "有故事线的情侣纪念网页",
    desc: "星空开场 · 密码解锁 · 恋爱计时 · 时间轴 · 相册 · 地图足迹 · 心愿清单 · 海报生成。",
    url: "love.html",
    cover: "",
    cat: "互动",
    badge: "hot",
    date: "2026-11-06"
  },
  {
    title: "我们的宇宙 · 情侣纪念日",
    desc: "只属于两个人的纪念日网页。深空主题、双人卡片、纪念时光轴、相册与心愿墙。",
    url: "commemorate/index.html",
    cover: "",
    cat: "纪念",
    badge: "new",
    date: "2026-11-06"
  },
  {
    title: "社区 · 邻里服务",
    desc: "面向大型社区的低偿邻里互助平台。住户核验、风险分级、楼栋协调人、居民/服务者/协调人/管理员四端协同。",
    url: "binjiang/index.html",
    cover: "",
    cat: "平台",
    badge: "new",
    date: "2026-11-06"
  },
  {
    title: "幼师助手 · 视频观察记录生成",
    desc: "上传活动视频，AI 生成三段式观察记录：观察情况 · 识别分析 · 教育策略。还有绘本动画、PPT 课件生成。",
    url: "teacher/index.html",
    cover: "",
    cat: "工具",
    badge: "hot",
    date: "2026-11-08"
  },
  {
    title: "生活小助手",
    desc: "28 个离线可用的生活工具：计算换算、二维码、待办记账、喝水吃药提醒、健康记录。数据只存本机，可加到手机主屏。",
    url: "lifeHelp/index.html",
    cover: "lifeHelp/icon.svg",
    cat: "工具",
    badge: "new",
    date: "2026-11-10"
  },
  // ───── 以后加新网页，复制下面这段改成你的 ─────
  // {
  //   title: "新网页的名字",
  //   desc: "一句话描述这个网页是做什么的。",
  //   url: "新网页文件名.html",
  //   cover: "",
  //   cat: "工具",
  //   badge: "new",
  //   date: "2026-11-xx"
  // },
];

/* 分类配色（占位图用） */
const PALETTES={
  "互动":["#ff5c8a","#a86bff"],
  "工具":["#5ce1ff","#a86bff"],
  "纪念":["#ff8fb1","#ffd479"],
  "平台":["#5ce1ff","#a86bff"],
  "默认":["#a86bff","#5ce1ff"]
};
const ICONS={
  "互动":"💖","工具":"🛠️","纪念":"💝","平台":"🏘️","默认":"✨"
};
function placeholder(title,cat){
  const p=PALETTES[cat]||PALETTES["默认"];
  const ico=ICONS[cat]||ICONS["默认"];
  const s=encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="375">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs>
<rect width="600" height="375" fill="url(#g)"/>
<circle cx="480" cy="80" r="130" fill="rgba(255,255,255,.14)"/>
<circle cx="100" cy="320" r="80" fill="rgba(255,255,255,.1)"/>
<text x="300" y="210" font-size="90" text-anchor="middle">${ico}</text>
</svg>`);
  return "data:image/svg+xml;charset=utf-8,"+s;
}
function coverOf(page){
  return page.cover && page.cover.trim() ? page.cover : placeholder(page.title,page.cat);
}

/* 渲染 */
const grid=document.getElementById("grid");
const tagsBar=document.getElementById("tags");
let activeCat="全部";

function renderTags(){
  const cats=["全部",...new Set(PAGES.map(p=>p.cat))];
  tagsBar.innerHTML="";
  cats.forEach(c=>{
    const el=document.createElement("div");
    el.className="tag"+(c===activeCat?" on":"");
    el.textContent=c;
    el.onclick=()=>{activeCat=c;renderTags();renderCards();};
    tagsBar.appendChild(el);
  });
}

function renderCards(){
  const list=activeCat==="全部"?PAGES:PAGES.filter(p=>p.cat===activeCat);
  grid.innerHTML="";
  if(!list.length){
    grid.innerHTML=`<div class="empty"><ico>📭</ico>这个分类下还没有内容</div>`;
    return;
  }
  list.forEach((p,i)=>{
    const el=document.createElement("a");
    el.className="card";
    // 同窗口跳转，避免微信内置浏览器拦截 target=_blank；带 from=hub 参数让子页面显示返回按钮
    el.href = p.url.includes("?") ? p.url + "&from=hub" : p.url + "?from=hub";
    el.rel="noopener";
    el.style.animationDelay=(i*0.06)+"s";
    const badgeHtml = p.badge ? `<div class="cover-badge ${p.badge}">${
      p.badge==="hot"?"🔥 HOT":p.badge==="new"?"✨ NEW":""
    }</div>` : "";
    el.innerHTML=`
      <div class="card-cover">
        ${badgeHtml}
        <img src="${coverOf(p)}" alt="${p.title}" loading="lazy">
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}<span class="arrow">→</span></div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-meta">
          <span class="cat">#${p.cat}</span>
          <span class="date">${p.date||""}</span>
        </div>
      </div>`;
    grid.appendChild(el);
  });
}

document.getElementById("totalCount").textContent=PAGES.length;
renderTags();
renderCards();
</script>
</body>
</html>
