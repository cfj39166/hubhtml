<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可接品类开关 — 服务者端</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .catrow { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  .catrow:last-child { border-bottom: none; }
  .catrow.lock { opacity: .6; }
</style>
</head>
<body>
<div id="nav"></div>

<div class="wrap" style="padding-top:24px">
  <div class="mb-16">
    <h1 style="font-size:21px">可接品类开关</h1>
    <p class="muted small mt-4">按认证等级开放 A/B 类；C 类只对机构开放。</p>
  </div>

  <div class="split">
    <div id="phone"></div>
    <div>
      <div class="row wrapf mb-12" style="gap:6px">
        <a href="join.html" class="btn btn-sm">分层认证</a>
        <a href="cats.html" class="btn btn-sm btn-primary">品类开关</a>
        <a href="hall.html" class="btn btn-sm">接单大厅</a>
        <a href="certs.html" class="btn btn-sm">资质到期</a>
        <a href="agreement.html" class="btn btn-sm">协议保险</a>
        <a href="track.html" class="btn btn-sm">过程留痕</a>
        <a href="income.html" class="btn btn-sm">收入结算</a>
        <a href="appeal.html" class="btn btn-sm">评价申诉</a>
      </div>

      <div id="noteS02"></div>

      <div class="card">
        <div class="card-head"><h3>开关的三个状态</h3></div>
        <div class="tl">
          <div class="tl-item done"><div class="tt">可开（等级够 + 资质齐）</div><div class="td">服务者自行决定开不开。不强制全开 —— 有人只想做代取，不想做宠物。</div></div>
          <div class="tl-item now"><div class="tt">可开但需补资质</div><div class="td">等级够了，但缺品类资质（如保洁要健康证）。开关置灰，提示补什么。</div></div>
          <div class="tl-item bad"><div class="tt">等级不足，不可开</div><div class="td">B 类需要 lv≥2，C 类对所有居民关闭。<b>不可通过任何方式绕过</b>。</div></div>
        </div>
        <div class="notice notice-warn mt-12" style="font-size:12px">
          <span class="ic">!</span>
          <div>防止低认证接高风险单 —— 这个开关是<b>服务者端唯一能影响权限的地方</b>，
          而且只能往「关闭」方向影响，不能往「开启」方向越权。</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
initPage('provider/hall.html', { root: '../' });
document.getElementById('noteS02').innerHTML = featureNote('S02');

// 王秀兰 lv3, 已有养宠经验证明
const ME = { lv: 3, certs: ['养宠经验证明', '无犯罪记录承诺', '人脸核验', '实名认证'] };
const ENABLED = ['A1', 'A2', 'A4', 'B1'];
const NEED_CERT = { 'B2': '健康证 + 居家上门服务证', 'B3': '无犯罪记录核验', 'B4': '陪诊培训证明', 'B5': '—' };

document.getElementById('phone').innerHTML = phoneOpen('可接品类', 'body', { tabs: TABS.provider });

function row(c) {
  const enabled = ENABLED.includes(c.id);
  const levelOk = ME.lv >= c.needLv;
  const orgOnly = c.orgOnly;
  const needCert = NEED_CERT[c.id];
  const certOk = !needCert || needCert === '—' || ME.certs.some(x => needCert.includes(x));

  if (orgOnly) {
    return `
    <div class="catrow lock">
      <span style="font-size:18px">${c.icon}</span>
      <div style="flex:1">
        <div class="row" style="gap:5px">
          <span class="small strong">${c.name}</span>
          <span class="tag tag-c" style="font-size:9px">C 类</span>
        </div>
        <div class="smaller muted mt-3">仅持证机构可承接，居民个人不可开启</div>
      </div>
      <span class="tag tag-gray" style="font-size:10px">不可开</span>
    </div>`;
  }
  return `
  <div class="catrow ${levelOk && certOk ? '' : 'lock'}">
    <span style="font-size:18px">${c.icon}</span>
    <div style="flex:1;min-width:0">
      <div class="row wrapf" style="gap:5px">
        <span class="small strong">${c.name}</span>
        <span class="tag ${Data.riskClass(c.risk)}" style="font-size:9px">${c.risk} 类</span>
      </div>
      <div class="smaller muted mt-3">
        ${!levelOk ? `需 lv≥${c.needLv}（当前 lv${ME.lv}）`
          : !certOk ? `需补充资质：${needCert}`
          : `${c.guide} · 需 lv≥${c.needLv} ✓`}
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" ${enabled ? 'checked' : ''} ${levelOk && certOk ? '' : 'disabled'}
        onchange="toast(this.checked ? '已开启「${c.name}」' : '已关闭「${c.name}」')">
      <span class="sl"></span>
    </label>
  </div>`;
}

document.getElementById('body').innerHTML = `
  <div class="card" style="padding:11px">
    <div class="row-between">
      <div>
        <div class="small strong">王秀兰</div>
        <div class="row mt-3" style="gap:5px">${Data.trustDots(3)}<span class="smaller muted">${Data.trustName(3)}</span></div>
      </div>
      <div class="center"><div class="strong">${ENABLED.length}</div><div class="smaller muted">已开启</div></div>
    </div>
  </div>

  <div class="card">
    <div class="strong small mb-8">A 类 · 低风险</div>
    ${CATEGORIES.filter(c => c.risk === 'A').map(row).join('')}
  </div>

  <div class="card">
    <div class="strong small mb-8">B 类 · 中风险</div>
    ${CATEGORIES.filter(c => c.risk === 'B').map(row).join('')}
  </div>

  <div class="card">
    <div class="strong small mb-8">C 类 · 仅机构</div>
    ${CATEGORIES.filter(c => c.risk === 'C').map(row).join('')}
  </div>

  <div class="card" style="background:var(--line-soft);border:1px dashed var(--line)">
    <div class="smaller muted" style="line-height:1.75">
      开关只能往「关闭」方向调整自己的接单范围。<br>
      等级不足或资质缺失的品类<b>无法通过任何方式开启</b>，需先完成认证。
    </div>
  </div>
`;
</script>
</body>
</html>
