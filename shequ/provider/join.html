<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分层认证入驻 — 服务者端</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .lvcard { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); overflow: hidden; margin-bottom: 12px; }
  .lvcard .h { padding: 12px 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line-soft); }
  .lvcard .b { padding: 13px 15px; }
  .req { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 12px; border-bottom: 1px solid var(--line-soft); }
  .req:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="nav"></div>

<div class="wrap" style="padding-top:24px">
  <div class="mb-16">
    <h1 style="font-size:21px">分层认证入驻</h1>
    <p class="muted small mt-4">真实邻居认证 → 平台认可认证（实名 + 人脸 + 无犯罪承诺 + 品类资质）→ 社区信赖等级。</p>
  </div>

  <div class="split">
    <div id="phone"></div>
    <div>
      <div class="row wrapf mb-12" style="gap:6px">
        <a href="join.html" class="btn btn-sm btn-primary">分层认证</a>
        <a href="cats.html" class="btn btn-sm">品类开关</a>
        <a href="hall.html" class="btn btn-sm">接单大厅</a>
        <a href="certs.html" class="btn btn-sm">资质到期</a>
        <a href="agreement.html" class="btn btn-sm">协议保险</a>
        <a href="track.html" class="btn btn-sm">过程留痕</a>
        <a href="income.html" class="btn btn-sm">收入结算</a>
        <a href="appeal.html" class="btn btn-sm">评价申诉</a>
      </div>

      <div id="noteS01"></div>

      <div class="card">
        <div class="card-head"><h3>每一层要求什么、解锁什么</h3></div>
        <div id="lvCards"></div>
        <div class="notice notice-info" style="font-size:12px">
          <span class="ic">i</span>
          <div>实名只证明「这个人存在」，分层才证明「这个人可靠」。
          注意第三层「社区信赖」<b>不是申请来的</b> —— 它是动态算出来的，所以不可购买。</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
initPage('provider/hall.html', { root: '../' });
document.getElementById('noteS01').innerHTML = featureNote('S01');

document.getElementById('lvCards').innerHTML = TRUST_LEVELS.map(l => `
  <div class="lvcard" style="border-left:3px solid ${l.color}">
    <div class="h" style="background:${l.lv <= 2 ? 'var(--brand-softer)' : 'var(--line-soft)'}">
      <div style="width:28px;height:28px;border-radius:8px;background:${l.lv <= 2 ? l.color : 'var(--ink-4)'};
        color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700">L${l.lv}</div>
      <div style="flex:1">
        <div class="strong">${l.name}</div>
        <div class="smaller muted">全小区 ${l.count} 人</div>
      </div>
      <span class="tag tag-brand" style="font-size:10px">${l.unlock}</span>
    </div>
    <div class="b">
      <div class="smaller muted" style="line-height:1.7">${l.how}</div>
    </div>
  </div>`).join('');

const ME = { lv: 2, name: '王秀兰' };

document.getElementById('phone').innerHTML = phoneOpen('我的认证', 'body', { tabs: TABS.provider });

document.getElementById('body').innerHTML = `
  <div class="card">
    <div class="row" style="gap:11px">
      <div class="avatar avatar-lg" style="background:${Data.avatarColor(ME.name)}">王秀</div>
      <div style="flex:1">
        <div class="strong">${ME.name}</div>
        <div class="row mt-4" style="gap:5px">
          ${Data.trustDots(ME.lv)}
          <span class="tag tag-ok" style="font-size:10px">${Data.trustName(ME.lv)}</span>
        </div>
        <div class="smaller muted mt-3">12 号楼 · 可接 A 类 + B 类</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="strong small mb-8">认证进度</div>
    ${TRUST_LEVELS.map(l => {
      const done = l.lv <= ME.lv;
      return `
      <div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--line-soft)">
        <div class="row" style="gap:8px">
          <div style="width:20px;height:20px;border-radius:50%;background:${done ? l.color : 'var(--line-soft)'};
            color:${done ? '#fff' : 'var(--ink-4)'};display:grid;place-items:center;font-size:10px;font-weight:700">
            ${done ? '✓' : l.lv}</div>
          <div>
            <div class="small ${done ? 'strong' : 'muted'}">${l.name}</div>
            <div class="smaller muted-2">${l.unlock}</div>
          </div>
        </div>
        <span class="tag ${done ? 'tag-ok' : 'tag-gray'}" style="font-size:10px">${done ? '已完成' : '未完成'}</span>
      </div>`;
    }).join('')}
  </div>

  <div class="card">
    <div class="strong small mb-8">第二层认证材料</div>
    <div class="req"><span style="color:var(--risk-a)">✓</span><div style="flex:1">实名认证</div><span class="smaller muted">已通过</span></div>
    <div class="req"><span style="color:var(--risk-a)">✓</span><div style="flex:1">人脸核验</div><span class="smaller muted">已通过</span></div>
    <div class="req"><span style="color:var(--risk-a)">✓</span><div style="flex:1">无犯罪记录承诺</div><span class="smaller muted">已签署</span></div>
    <div class="req"><span style="color:var(--risk-a)">✓</span><div style="flex:1">养宠经验证明</div><span class="smaller muted">已上传</span></div>
    <div class="req"><span style="color:var(--risk-w)">○</span><div style="flex:1">健康证</div>
      <button class="btn btn-sm" onclick="toast('请上传健康证照片')">上传</button></div>
    <div class="req"><span style="color:var(--risk-w)">○</span><div style="flex:1">居家上门服务证</div>
      <button class="btn btn-sm" onclick="toast('请上传居家上门服务证')">上传</button></div>
  </div>

  <div class="card">
    <div class="strong small mb-8">升级到「社区信赖」需要</div>
    <div class="smaller muted" style="line-height:1.85">
      · 完成单量 ≥ 50 单（当前 143 单 ✓）<br>
      · 服务评分 ≥ 4.8（当前 4.9 ✓）<br>
      · 无未闭环纠纷（当前 0 ✓）<br>
      · 获得 ≥ 2 名楼栋协调人推荐（当前 1 名）<br>
      <span style="color:var(--brand)">还差 1 名楼栋长推荐即可升级</span>
    </div>
  </div>

  <div class="card" style="background:var(--risk-b-bg);border-color:#f5dcb4">
    <div class="smaller" style="color:#7c4a06;line-height:1.75">
      <b>重要</b>：无犯罪记录承诺是<b>承诺 + 抽查</b>机制，不是一次性核验。
      涉及接娃、上门服务、宠物多日寄养时，平台有权要求补充核验材料。
    </div>
  </div>
`;
</script>
</body>
</html>
