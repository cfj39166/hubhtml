<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的 — 用户端</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .entry { display: flex; align-items: center; justify-content: space-between;
    padding: 13px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer;
    transition: all .15s; }
  .entry:last-child { border-bottom: none; }
  .entry:hover { color: var(--brand); }
  .entry .l { display: flex; align-items: center; gap: 11px; }
  .entry .ico { width: 32px; height: 32px; border-radius: 10px; background: var(--brand-softer);
    display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }
  .entry .nm { font-size: 13.5px; font-weight: 550; }
  .entry .r { font-size: 12px; color: var(--ink-4); display: flex; align-items: center; gap: 7px; }
  .mini-stat { padding: 10px 8px; background: var(--brand-softer); border-radius: 10px; text-align: center; }
  .mini-stat .n { font-size: 17px; font-weight: 700; letter-spacing: -.4px; }
  .mini-stat .l { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
</style>
</head>
<body>
<div id="nav"></div>

<div class="wrap" style="padding-top:28px">
  <div class="mb-16">
    <h1 style="font-size:24px;letter-spacing:-.6px">我的</h1>
    <p class="muted mt-8" style="font-size:13.5px">用户端 17 个页面的入口，以及个人信用、楼栋信息。</p>
  </div>

  <div class="split">
    <div id="phone"></div>
    <div>
      <div class="card">
        <div class="card-head"><h3>用户端页面索引</h3><span class="sub">17 个功能点</span></div>
        <div class="row wrapf" style="gap:7px" id="pageIdx"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>用户端功能清单</h3><span class="sub">每项含具体设计与理由</span></div>
        <div id="featList"></div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
initPage('app/index.html', { root: '../' });

document.getElementById('pageIdx').innerHTML = F_USER.map(f =>
  `<a href="${f.page.replace('app/', '')}" class="btn btn-sm">${f.n}</a>`
).join('');

document.getElementById('featList').innerHTML = featureList(F_USER);

document.getElementById('phone').innerHTML = phoneOpen('我的', 'body', { tabs: TABS.user });

document.getElementById('body').innerHTML = `
  <div class="card">
    <div class="row" style="gap:12px">
      <div class="avatar avatar-lg" style="background:linear-gradient(140deg,#2f8f6d,#17604a)">业主</div>
      <div style="flex:1">
        <div class="strong" style="font-size:15px">业主 12-3-502</div>
        <div class="row mt-4" style="gap:6px">
          ${Data.trustDots(2)}
          <span class="tag tag-ok" style="font-size:10px">平台认可</span>
        </div>
        <div class="smaller muted mt-4">12 号楼 3 单元 502 · 东片区</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row-between mb-8">
      <span class="strong small">我的信用</span>
      <a href="credit.html" class="smaller">信用中心 ›</a>
    </div>
    <div class="grid grid-3" style="gap:8px">
      <div class="mini-stat"><div class="n">92</div><div class="l">信用分</div></div>
      <div class="mini-stat"><div class="n">27</div><div class="l">完成单</div></div>
      <div class="mini-stat"><div class="n">4.8</div><div class="l">评分</div></div>
    </div>
  </div>

  <div class="card" style="padding:4px 15px">
    <div class="entry" onclick="location.href='subscribe.html'">
      <div class="l"><span class="ico">🔁</span><span class="nm">常用订单</span></div>
      <span class="r">3 个 ›</span>
    </div>
    <div class="entry" onclick="location.href='share.html'">
      <div class="l"><span class="ico">🔧</span><span class="nm">共享工具</span></div>
      <span class="r">4 件在借 ›</span>
    </div>
    <div class="entry" onclick="location.href='group.html'">
      <div class="l"><span class="ico">👥</span><span class="nm">拼单 / 轮值</span></div>
      <span class="r">1 个进行中 ›</span>
    </div>
    <div class="entry" onclick="location.href='agency.html'">
      <div class="l"><span class="ico">🏛️</span><span class="nm">机构服务</span></div>
      <span class="r">›</span>
    </div>
    <div class="entry" onclick="location.href='notify.html'">
      <div class="l"><span class="ico">🔔</span><span class="nm">消息通知</span></div>
      <span class="r"><span class="tag tag-danger" style="font-size:10px">3</span> ›</span>
    </div>
    <div class="entry" onclick="location.href='privacy.html'">
      <div class="l"><span class="ico">🔒</span><span class="nm">隐私与地址</span></div>
      <span class="r">›</span>
    </div>
    <div class="entry" onclick="location.href='review.html'">
      <div class="l"><span class="ico">⭐</span><span class="nm">待评价</span></div>
      <span class="r"><span class="tag tag-warn" style="font-size:10px">1</span> ›</span>
    </div>
  </div>

  <div class="card">
    <div class="strong small mb-8">我的楼栋</div>
    <div class="smaller muted" style="line-height:1.85">
      12 号楼 · 2 个单元 · 36 户 · 东片区<br>
      楼栋协调人：已设置<br>
      本楼栋认证服务者：2 人
    </div>
    <button class="btn btn-sm btn-block mt-12" onclick="toast('已提交楼栋协调人申请')">申请成为楼栋协调人</button>
  </div>

  <div class="card" style="background:var(--brand-softer);border-color:#cfe6dc">
    <div class="smaller" style="color:var(--ink-2);line-height:1.75">
      本平台以微信小程序为唯一入口，不提供独立 App。服务者端复用同一小程序，通过身份切换进入。
    </div>
  </div>
`;
</script>
</body>
</html>
