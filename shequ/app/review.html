<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双向评价与投诉 — 用户端</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .stars { display: flex; gap: 5px; font-size: 24px; }
  .stars span { cursor: pointer; color: var(--line); }
  .stars span.on { color: #f59e0b; }
  .chip { display: inline-block; border: 1px solid var(--line); border-radius: 16px;
    padding: 4px 11px; font-size: 11.5px; color: var(--ink-2); cursor: pointer; margin: 0 6px 6px 0; }
  .chip.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-dark); font-weight: 600; }
  .dual { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<div id="nav"></div>

<div class="wrap" style="padding-top:24px">
  <div class="mb-16">
    <h1 style="font-size:21px">双向评价与投诉</h1>
    <p class="muted small mt-4">需求方评服务者，服务者也评需求方；恶意差评、放鸽子扣信用。</p>
  </div>

  <div class="split">
    <div id="phone"></div>

    <div>
      <div id="noteU10"></div>

      <div class="card">
        <div class="card-head"><h3>双向约束的加减分对照</h3></div>
        <div class="dual" id="dualRules"></div>
        <div class="notice notice-danger mt-12" style="font-size:12px">
          <span class="ic">⚠</span>
          <div><b>只约束服务者会摧毁供给意愿。</b>失败案例中「帮人三次才涨 1 分、不帮也有基础分」的不公平设计，
          会让服务者做几单就流失 —— 供需两侧都要有代价，池子才稳定。</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>恶意差评的判定与申诉</h3></div>
        <div class="tl">
          <div class="tl-item done"><div class="tt">什么算恶意差评</div><div class="td">无实际交易、评价内容与订单无关、明显与凭证证据矛盾、同一用户短期内集中给同一服务者差评。</div></div>
          <div class="tl-item done"><div class="tt">申诉入口在服务者端</div><div class="td">服务者可在服务者端提交申诉，附订单凭证。平台 24 小时内裁定。</div></div>
          <div class="tl-item done"><div class="tt">裁定后双向生效</div><div class="td">判定为恶意差评的，删除评价并给需求方扣 5 分；判定为正常差评的，服务者扣分维持。</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
initPage('app/index.html', { root: '../' });
document.getElementById('noteU10').innerHTML = featureNote('U10');

document.getElementById('dualRules').innerHTML = CREDIT_RULES.map(r => `
  <div style="border:1px solid var(--line);border-radius:var(--r);padding:12px">
    <div class="strong small mb-8">${r.side}</div>
    ${r.items.map(i => `
      <div class="row-between small" style="padding:4px 0">
        <span class="muted">${i.k}</span>
        <span class="strong" style="color:${i.v.startsWith('+') ? 'var(--risk-a)' : 'var(--risk-c)'}">${i.v}</span>
      </div>`).join('')}
  </div>`).join('');

document.getElementById('phone').innerHTML = phoneOpen('评价与投诉', 'body', { back: 'index.html', tabs: TABS.user });

document.getElementById('body').innerHTML = `
  <div class="card">
    <div class="row" style="gap:10px">
      <div class="avatar" style="background:${Data.avatarColor('孙丽华')}">孙丽</div>
      <div style="flex:1">
        <div class="row" style="gap:5px"><span class="small strong">孙丽华</span>${Data.trustDots(2)}</div>
        <div class="smaller muted mt-3">宠物短期寄养 · 4 天 · ¥320</div>
      </div>
      <span class="tag tag-ok" style="font-size:10px">已完成</span>
    </div>
  </div>

  <div class="card">
    <div class="strong small mb-12">这次服务怎么样？</div>
    <div class="stars" id="stars">
      <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5" class="on">★</span>
    </div>
    <div class="smaller muted mt-8" id="starTip">非常满意</div>
  </div>

  <div class="card">
    <div class="strong small mb-8">具体评价</div>
    <div>
      ${['守时', '沟通顺畅', '宠物状态好', '照片反馈及时', '价格公道', '细心'].map((t, i) => `
        <span class="chip${i < 3 ? ' on' : ''}" onclick="this.classList.toggle('on')">${t}</span>`).join('')}
    </div>
    <textarea placeholder="说说这次服务的体验，帮助其他邻居判断" style="margin-top:8px">出门 4 天，每天都发照片和视频，回来猫的状态很好。价格也公道。</textarea>
  </div>

  <div class="card">
    <div class="strong small mb-8">上传凭证（可选）</div>
    <div class="row" style="gap:7px">
      <div class="thumb">+ 图片</div>
    </div>
  </div>

  <div class="card" style="background:var(--risk-b-bg);border-color:#f5dcb4">
    <div class="smaller" style="color:#7c4a06;line-height:1.75">
      <b>提示</b>：恶意差评、与订单无关的评价会被判定无效并扣除信用分 5 分。
      服务者有权申诉，平台将依据订单凭证裁定。
    </div>
  </div>

  <button class="btn btn-primary btn-block btn-lg mt-12" onclick="toast('评价已提交，服务者信用分 +1')">提交评价</button>
  <button class="btn btn-block mt-8" onclick="showComplaint()">我要投诉</button>

  <div class="card hidden mt-12" id="complaintBox" style="background:var(--risk-c-bg);border-color:#f8cfcd">
    <div class="strong small mb-8" style="color:#8f1d19">投诉工单</div>
    <div class="field" style="margin-bottom:10px">
      <label style="font-size:12px">投诉类型</label>
      <select>
        <option>服务未完成</option><option>物品损坏</option>
        <option>宠物受伤 / 走失</option><option>态度问题</option>
        <option>涉及安全风险</option><option>其他</option>
      </select>
    </div>
    <div class="field" style="margin-bottom:10px">
      <label style="font-size:12px">问题描述</label>
      <textarea placeholder="请描述具体情况"></textarea>
    </div>
    <div class="smaller" style="color:#8f1d19;line-height:1.7">
      提交后订单资金将<b>自动冻结</b>，平台在 24—48 小时内依据凭证作出判定。
      楼栋协调人会先做初步协调。
    </div>
    <button class="btn btn-danger btn-block mt-12" onclick="toast('投诉已提交，资金已冻结')">提交投诉并冻结资金</button>
  </div>
`;

// 星级
document.getElementById('stars').addEventListener('click', e => {
  const s = e.target.closest('span');
  if (!s) return;
  const v = +s.dataset.v;
  document.querySelectorAll('#stars span').forEach(x => x.classList.toggle('on', +x.dataset.v <= v));
  document.getElementById('starTip').textContent = ['很不满意', '不满意', '一般', '满意', '非常满意'][v - 1];
});

function showComplaint() {
  document.getElementById('complaintBox').classList.remove('hidden');
}
</script>
</body>
</html>
