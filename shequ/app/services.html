<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务分级展示 — 用户端</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .grp { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); overflow: hidden; }
  .grp + .grp { margin-top: 14px; }
  .grp-head { padding: 13px 17px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  .grp.a .grp-head { background: var(--risk-a-bg); }
  .grp.b .grp-head { background: var(--risk-b-bg); }
  .grp.c .grp-head { background: var(--risk-c-bg); }
  .grp-head .t { font-size: 15px; font-weight: 700; }
  .grp-head .s { font-size: 11.5px; color: var(--ink-3); }
  .grp-body { padding: 12px 15px 15px; }
  .crow { display: flex; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); align-items: flex-start; }
  .crow:last-child { border-bottom: none; }
  .crow .ic { font-size: 19px; }
  .crow .n { font-size: 13px; font-weight: 600; }
  .crow .m { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.55; }
</style>
</head>
<body>
<div id="nav"></div>

<div class="wrap" style="padding-top:24px">
  <div class="mb-16">
    <h1 style="font-size:21px">服务分级展示</h1>
    <p class="muted small mt-4">A 类低风险、B 类中风险、C 类机构服务分区展示，C 类不开放个人接单。</p>
  </div>

  <div class="split">
    <div id="phone"></div>

    <div>
      <div id="noteU03"></div>

      <div class="card">
        <div class="card-head"><h3>分区的本质是门槛差异</h3></div>
        <p class="small" style="line-height:1.9;color:var(--ink-2)">
          三个分区不只是视觉分组，它们背后是<b>三套完全不同的准入门槛、协议要求和保险配置</b>。
          用户在浏览时感知到的是分区，平台在后台执行的是分级。
        </p>
        <div class="hr"></div>
        <div class="tbl-wrap" style="margin:0;padding:0">
          <table class="tbl">
            <thead><tr><th>维度</th><th>A 类</th><th>B 类</th><th>C 类</th></tr></thead>
            <tbody>
              <tr><td class="strong">接单门槛</td><td>真实邻居（lv1）</td><td>平台认可（lv2）</td><td>仅持证机构</td></tr>
              <tr><td class="strong">书面协议</td><td>不需要</td><td>强制签署</td><td>机构合同</td></tr>
              <tr><td class="strong">保险</td><td>无</td><td>平台责任险</td><td>机构自有</td></tr>
              <tr><td class="strong">凭证要求</td><td>服务前后照片</td><td>三段式 + 确认码</td><td>机构服务记录</td></tr>
              <tr><td class="strong">匹配范围</td><td>同楼栋优先</td><td>可全小区</td><td>平台入口</td></tr>
              <tr><td class="strong">平台角色</td><td>撮合 + 凭证</td><td>居间 + 凭证</td><td>入口 + 筛选</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
initPage('app/index.html', { root: '../' });
document.getElementById('noteU03').innerHTML = featureNote('U03');

const A = CATEGORIES.filter(c => c.risk === 'A');
const B = CATEGORIES.filter(c => c.risk === 'B');
const C = CATEGORIES.filter(c => c.risk === 'C');

function group(risk, title, sub, list) {
  return `
  <div class="grp ${risk.toLowerCase()}">
    <div class="grp-head">
      <span class="tag tag-${risk.toLowerCase()}">${risk} 类</span>
      <div style="flex:1">
        <div class="t">${title}</div>
        <div class="s">${sub}</div>
      </div>
      <span class="smaller muted">${list.length} 项</span>
    </div>
    <div class="grp-body">
      ${list.map(c => `
        <div class="crow">
          <span class="ic">${c.icon}</span>
          <div style="flex:1;min-width:0">
            <div class="row wrapf" style="gap:6px">
              <span class="n">${c.name}</span>
            </div>
            <div class="m">
              ${c.guide} · ${c.orgOnly ? '仅机构承接' : '接单门槛 lv≥' + c.needLv + (c.agreement ? ' · 需签协议' : '') + (c.insurance ? ' · 含保险' : '')}
            </div>
            ${c.orgOnly ? `<div class="m" style="color:#8f1d19">${c.reason}</div>` : ''}
            <div class="row wrapf mt-8" style="gap:5px">
              ${(c.fields || []).slice(0, 4).map(f => `<span class="tag tag-gray" style="font-weight:400">${f.k}${f.req ? '*' : ''}</span>`).join('')}
            </div>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

document.getElementById('phone').innerHTML = phoneOpen('服务分级', 'body', { back: 'index.html', tabs: TABS.user });
document.getElementById('body').innerHTML = `
  <div class="notice notice-info mb-12" style="font-size:11.5px;padding:9px 11px">
    <span class="ic">i</span>
    <div>按风险等级分区，不同分区的接单门槛、协议要求和保险配置不同。<b>带 * 为强制填写字段</b>。</div>
  </div>
  ${group('A', '低风险服务', '认证居民即可接单', A)}
  ${group('B', '中风险服务', '需平台认证 + 书面协议 + 保险', B)}
  ${group('C', '高风险机构服务', '不由居民个人直接接单', C)}
  <div class="card" style="padding:12px;background:var(--risk-c-bg);border-color:#f8cfcd">
    <div class="smaller" style="color:#8f1d19;line-height:1.75">
      <b>C 类为什么单独放：</b>不是不做，而是平台只做「入口」和「筛选」。
      对接社区嵌入式托育点、养老服务机构、持证家政企业，负责展示资质、收集评价，
      但不让个人以「互助」名义承接。长期看孩子、失能老人照护、医疗行为都在此列。
    </div>
  </div>
`;
</script>
</body>
</html>
