<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信用中心 — 用户端</title>
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .ring { width: 84px; height: 84px; border-radius: 50%;
    background: conic-gradient(var(--brand) 0% 92%, var(--line-soft) 92% 100%);
    display: grid; place-items: center; flex-shrink: 0; }
  .ring .in { width: 68px; height: 68px; border-radius: 50%; background: var(--card);
    display: grid; place-items: center; flex-direction: column; }
  .lvstep { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  .lvstep:last-child { border-bottom: none; }
  .lvd { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; background: var(--line-soft); color: var(--ink-4); }
</style>
</head>
<body>
<div id="nav"></div>

<div class="wrap" style="padding-top:24px">
  <div class="mb-16">
    <h1 style="font-size:21px">信用中心</h1>
    <p class="muted small mt-4">展示自己的信任等级、完成单、协议记录、违约记录。</p>
  </div>

  <div class="split">
    <div id="phone"></div>
    <div>
      <div id="noteU17"></div>
      <div class="card">
        <div class="card-head"><h3>信用可见才有约束力</h3></div>
        <p class="small" style="line-height:1.9;color:var(--ink-2)">
          信用分如果只存在后台，它约束不了任何人。信用中心要解决的是<b>让每个人随时能看到自己的分</b>，
          并且清楚地知道<b>做什么会扣分</b> —— 扣分规则必须公开、可预期，否则就变成了黑箱。
        </p>
        <div class="hr"></div>
        <div class="small strong mb-8">信用中心必须包含的四块</div>
        <div class="tl">
          <div class="tl-item done"><div class="tt">信任等级（三层）</div><div class="td">当前在第几层、下一层需要什么条件、解锁什么权限。</div></div>
          <div class="tl-item done"><div class="tt">完成单与协议记录</div><div class="td">签过哪些协议、哪一版、什么时候签的。纠纷时要能查。</div></div>
          <div class="tl-item done"><div class="tt">违约记录</div><div class="td">不隐藏自己的违约记录 —— 因为对方也能看到，藏没有意义。</div></div>
          <div class="tl-item done"><div class="tt">分数变动明细</div><div class="td">每一笔加减分的时间、原因、关联订单。有明细才能申诉。</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
initPage('app/index.html', { root: '../' });
document.getElementById('noteU17').innerHTML = featureNote('U17');

const ME = { name: '业主 12-3-502', lv: 2, score: 92, done: 27, rating: 4.8 };

document.getElementById('phone').innerHTML = phoneOpen('信用中心', 'body', { back: 'index.html', tabs: TABS.user });

document.getElementById('body').innerHTML = `
  <div class="card">
    <div class="row" style="gap:12px">
      <div class="ring"><div class="in">
        <div class="strong" style="font-size:19px">${ME.score}</div>
        <div class="smaller muted-2">信用分</div>
      </div></div>
      <div style="flex:1">
        <div class="strong">${ME.name}</div>
        <div class="row mt-4" style="gap:6px">
          ${Data.trustDots(ME.lv)}
          <span class="tag tag-ok" style="font-size:10px">${Data.trustName(ME.lv)}</span>
        </div>
        <div class="smaller muted mt-4">12 号楼 · 东片区</div>
        <div class="smaller mt-4" style="color:var(--brand)">距离「社区信赖」还差 5 单 + 无纠纷</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="strong small mb-8">我的信任等级</div>
    ${TRUST_LEVELS.map(l => `
      <div class="lvstep">
        <div class="lvd" style="${l.lv <= ME.lv ? `background:${l.color};color:#fff` : ''}">${l.lv <= ME.lv ? '✓' : l.lv}</div>
        <div style="flex:1">
          <div class="row" style="gap:6px">
            <span class="small strong">${l.name}</span>
            ${l.lv <= ME.lv ? '<span class="tag tag-ok" style="font-size:10px">已获得</span>' : '<span class="tag tag-gray" style="font-size:10px">未获得</span>'}
          </div>
          <div class="smaller muted mt-3" style="line-height:1.6">${l.how}</div>
          <div class="smaller mt-3" style="color:var(--brand)">${l.unlock}</div>
        </div>
      </div>`).join('')}
  </div>

  <div class="card">
    <div class="strong small mb-8">我的数据</div>
    <div class="grid grid-3" style="gap:7px;text-align:center">
      <div style="padding:8px;background:var(--brand-softer);border-radius:var(--r-sm)">
        <div class="strong">${ME.done}</div><div class="smaller muted">完成单</div></div>
      <div style="padding:8px;background:var(--brand-softer);border-radius:var(--r-sm)">
        <div class="strong">${ME.rating}</div><div class="smaller muted">服务评分</div></div>
      <div style="padding:8px;background:var(--brand-softer);border-radius:var(--r-sm)">
        <div class="strong">0</div><div class="smaller muted">违约记录</div></div>
    </div>
  </div>

  <div class="card">
    <div class="strong small mb-8">已签署协议记录</div>
    ${AGREEMENTS.slice(0, 3).map(a => `
      <div class="row-between" style="padding:7px 0;border-bottom:1px solid var(--line-soft)">
        <div>
          <div class="small">${a.name}</div>
          <div class="smaller muted-2">签署于 2026-10-12 · 版本 ${a.ver}</div>
        </div>
        <span class="tag tag-ok" style="font-size:10px">有效</span>
      </div>`).join('')}
  </div>

  <div class="card">
    <div class="strong small mb-8">信用分变动明细</div>
    ${[
      { t: '完成订单「宠物短期寄养」', v: '+1', d: '11-09', c: 'a' },
      { t: '获得好评', v: '+1', d: '11-09', c: 'a' },
      { t: '完成订单「代取快递」', v: '+1', d: '11-02', c: 'a' },
      { t: '需求方放鸽子（对方责任）', v: '0', d: '10-28', c: 'n' },
      { t: '完成订单「上门喂猫」', v: '+1', d: '10-21', c: 'a' }
    ].map(i => `
      <div class="row-between" style="padding:7px 0;border-bottom:1px solid var(--line-soft)">
        <div>
          <div class="small">${i.t}</div>
          <div class="smaller muted-2">${i.d}</div>
        </div>
        <span class="strong small" style="color:${i.c === 'a' ? 'var(--risk-a)' : 'var(--ink-4)'}">${i.v}</span>
      </div>`).join('')}
    <div class="smaller muted mt-8" style="line-height:1.7">有明细才能申诉 —— 每笔变动都可追溯到具体订单。</div>
  </div>

  <div class="card" style="background:var(--risk-b-bg);border-color:#f5dcb4">
    <div class="smaller" style="color:#7c4a06;line-height:1.8">
      <b>扣分规则（双向，公开可预期）</b><br>
      · 服务者：超时未到 −3，纠纷败诉 −5，证件过期仍接单 −8<br>
      · 需求方：虚假需求 −5，恶意差评 −5，放鸽子 −3，拒付 −6<br>
      不做「帮人三次才涨 1 分、不帮也有基础分」的设计。
    </div>
  </div>
`;
</script>
</body>
</html>
