<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具/闲置共享 — 用户端</title>
<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
<div id="nav"></div>

<div class="wrap" style="padding-top:24px">
  <div class="mb-16">
    <h1 style="font-size:21px">工具/闲置共享</h1>
    <p class="muted small mt-4">电钻、梯子、露营装备等借还，押金或信用免押，归还确认。</p>
  </div>

  <div class="split">
    <div id="phone"></div>
    <div>
      <div id="noteU14"></div>
      <div class="card">
        <div class="card-head"><h3>为什么这是最好的冷启动品类</h3></div>
        <p class="small" style="line-height:1.9;color:var(--ink-2)">
          工具共享有三个别的品类没有的特点：<b>零风险</b>（不涉及人身安全）、
          <b>强需求</b>（电钻一年用两次，买不如借）、<b>天然双向</b>（借的人下次可能成为借出的人）。
        </p>
        <div class="hr"></div>
        <div class="small strong mb-8">押金机制的三档</div>
        <div class="tl">
          <div class="tl-item done"><div class="tt">信用免押</div><div class="td">信用分 ≥ 85 且无纠纷记录。价值 200 元以下的物品适用。</div></div>
          <div class="tl-item done"><div class="tt">押金托管</div><div class="td">按物品估值收取，平台托管。归还确认后原路退回。</div></div>
          <div class="tl-item done"><div class="tt">损坏协商</div><div class="td">按实际维修费用或折旧价，从押金中扣除，需双方确认。</div></div>
        </div>
        <div class="notice notice-info mt-12" style="font-size:12px">
          <span class="ic">i</span>
          <div>低风险高频，适合在冷启动阶段拉活跃 —— 它让居民第一次体验「平台能用」，
          而不需要一开始就托付宠物或孩子。</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
initPage('app/index.html', { root: '../' });
document.getElementById('noteU14').innerHTML = featureNote('U14');

document.getElementById('phone').innerHTML = phoneOpen('共享工具', 'body', { back: 'index.html', tabs: TABS.user });

document.getElementById('body').innerHTML = `
  <div class="row" style="gap:7px;margin-bottom:11px">
    <button class="btn btn-sm btn-primary" style="flex:1">全部</button>
    <button class="btn btn-sm" style="flex:1">本楼栋</button>
    <button class="btn btn-sm" style="flex:1">同片区</button>
  </div>

  ${SHARED_TOOLS.map(t => `
    <div class="card" style="padding:12px">
      <div class="row" style="gap:10px">
        <div style="width:44px;height:44px;border-radius:9px;background:var(--brand-soft);display:grid;place-items:center;font-size:19px;flex-shrink:0">🔧</div>
        <div style="flex:1;min-width:0">
          <div class="row wrapf" style="gap:6px">
            <span class="strong small">${t.name}</span>
            <span class="tag ${t.status === '可借' ? 'tag-ok' : 'tag-gray'}" style="font-size:10px">${t.status}</span>
          </div>
          <div class="smaller muted mt-3">${t.owner}</div>
          <div class="smaller mt-3" style="color:${t.deposit.includes('免押') ? 'var(--risk-a)' : 'var(--ink-2)'}">${t.deposit}</div>
        </div>
      </div>
      ${t.status === '可借' ? `
        <div class="row mt-8" style="gap:6px">
          <button class="btn btn-sm btn-primary" style="flex:1" onclick="toast('已发起借用申请，等待对方确认')">申请借用</button>
          <button class="btn btn-sm" onclick="toast('已发起会话')">联系</button>
        </div>` : `<div class="smaller muted mt-8">预计 11-08 归还</div>`}
    </div>`).join('')}

  <div class="card" style="background:var(--brand-softer);border-color:#d9e7ff">
    <div class="smaller" style="color:var(--ink-2);line-height:1.75">
      <b>借用流程</b>：申请 → 对方确认 → 交接拍照 → 使用 → 归还确认 → 押金退回。<br>
      归还时双方需共同确认物品状态，照片留存 30 天。
    </div>
  </div>
`;
</script>
</body>
</html>
